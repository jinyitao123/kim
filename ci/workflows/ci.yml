name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('push-{0}', github.sha) || format('dispatch-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  path-filter:
    name: Path filter
    runs-on: ubuntu-22.04
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            head="$CURRENT_SHA"
          fi
          if [[ "$base" =~ ^0+$ ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" "$head" -- . ':(exclude)docs' ':(exclude)*.md'; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

  production-audit:
    name: Production dependency audit
    needs: path-filter
    if: needs.path-filter.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      # pull_request defaults to a synthetic merge ref; audit the immutable PR
      # head itself so this required status names the exact proposed lockfile.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm run toolchain:bootstrap
      - run: npm run release:preflight:toolchain
      - name: Apply named production dependency audit exceptions
        run: npm run audit:production

  quality:
    needs: path-filter
    if: needs.path-filter.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm run toolchain:bootstrap
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run release:preflight:toolchain
      - run: npm run typecheck
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run build:bundle
      - run: npm run release:bundle-size
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

  hermetic-e2e:
    needs: path-filter
    if: needs.path-filter.outputs.run == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm run toolchain:bootstrap
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run release:preflight:toolchain
      - run: npm run build:bundle
      - run: npm run test:e2e:hermetic
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: error

  windows-state-migration:
    needs: path-filter
    if: needs.path-filter.outputs.run == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm run toolchain:bootstrap
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run release:preflight:toolchain
      - run: npm exec -- vitest run tests/backend/store-windows-migration.test.ts

  packaging-smoke:
    needs: path-filter
    if: github.event_name == 'pull_request' && needs.path-filter.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: mac
            arch: arm64
            extra_args: --config.mac.identity=null
          - runner: ubuntu-22.04
            target: linux
            arch: x64
            extra_args: ''
          - runner: windows-2022
            target: win
            arch: x64
            extra_args: ''
    runs-on: ${{ matrix.runner }}
    # CI has no access to the private Loom source; distribution packaging
    # bundles Loom and refuses this setting.
    env:
      GOOEYPI_RUNTIME_WITHOUT_LOOM: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm run toolchain:bootstrap
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run release:preflight:toolchain
      - run: npm run build:bundle
      - run: node scripts/release/electron-builder.mjs --dir --${{ matrix.target }} --${{ matrix.arch }} --publish=never --config.directories.output=release/${{ matrix.target }}/${{ matrix.arch }} ${{ matrix.extra_args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: matrix.target != 'mac'
        run: node scripts/release/verify-cross-platform-package.mjs --platform ${{ matrix.target }} --arch ${{ matrix.arch }} --unpacked-only
      # The Linux packages install chrome-sandbox setuid-root, so the smoke restores
      # those shipped permissions rather than launching with the sandbox disabled.
      - if: matrix.target == 'linux'
        run: |
          sudo chown root:root release/linux/${{ matrix.arch }}/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux/${{ matrix.arch }}/linux-unpacked/chrome-sandbox
      - name: Launch the packaged application
        if: matrix.target != 'mac'
        run: node scripts/release/smoke-packaged-app.mjs --platform ${{ matrix.target }} --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && matrix.target != 'mac' && hashFiles(format('release/{0}/{1}/packaged-smoke-diagnostics.log', matrix.target, matrix.arch)) != ''
        with:
          name: packaged-smoke-diagnostics-${{ matrix.target }}-${{ matrix.arch }}
          path: release/${{ matrix.target }}/${{ matrix.arch }}/packaged-smoke-diagnostics.log
          if-no-files-found: error

  local-qa-package:
    needs: [path-filter, production-audit, quality, hermetic-e2e, windows-state-migration]
    if: github.event_name == 'workflow_dispatch' && needs.path-filter.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            package: npm run package:mac:local-qa
            artifact: kim-local-qa-macos
            # Installers only: never upload the unpacked application directory.
            path: |
              release/mac/**/*.dmg
              release/mac/**/*.zip
          - runner: ubuntu-22.04
            package: npm run package:linux:local-qa
            artifact: kim-local-qa-linux
            path: |
              release/linux/**/*.AppImage
              release/linux/**/*.deb
              release/linux/**/*.rpm
              release/linux/**/*.pacman
          - runner: windows-2022
            package: npm run package:win:local-qa
            artifact: kim-local-qa-windows
            path: |
              release/win/**/*.exe
              release/win/**/*.zip
              release/win/**/*.appx
              release/win/**/*.msix
              !release/win/**/win-unpacked/**
    runs-on: ${{ matrix.runner }}
    # CI has no access to the private Loom source; distribution packaging
    # bundles Loom and refuses this setting.
    env:
      GOOEYPI_RUNTIME_WITHOUT_LOOM: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm run toolchain:bootstrap
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run release:preflight:toolchain
      - name: Install Linux native packaging tools
        if: matrix.runner == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      # Quality, E2E, Windows migration, and audit have passed for this exact SHA.
      # Keep native bundle creation and all post-package verification gates.
      - if: matrix.runner != 'windows-2022'
        run: ${{ matrix.package }} -- --skip-verify
      # The Windows npm runner rejects the forwarded --skip-verify flag. Use
      # the same direct entry point as the distribution workflow.
      - if: matrix.runner == 'windows-2022'
        run: node scripts/release/package.mjs --qa --platform win --skip-verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
